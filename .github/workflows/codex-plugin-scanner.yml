name: Codex Plugin Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: codex-plugin-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Codex plugin scanner
        uses: hashgraph-online/hol-codex-plugin-scanner-action@d69cef037c79f1d88bf6cacaf544a6a51c95ca64 # v1
        with:
          plugin_dir: "."
